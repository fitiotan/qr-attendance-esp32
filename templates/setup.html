<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Initial Setup - QR Attendance</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    .setup-container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      max-width: 450px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .info {
      background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
      border-left: 4px solid #667eea;
      padding: 15px;
      margin-bottom: 25px;
      border-radius: 5px;
      color: #1565c0;
      font-size: 14px;
    }
    .form-group {
      margin: 20px 0;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 5px;
      font-size: 16px;
      transition: all 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
    }
    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      margin-top: 10px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 5px;
      text-align: center;
      font-size: 14px;
    }
    .success {
      background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
      color: #155724;
      border-left: 4px solid #28a745;
    }
    .error {
      background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
      color: #721c24;
      border-left: 4px solid #dc3545;
    }
    @media (max-width: 480px) {
      .setup-container { padding: 25px; }
      h1 { font-size: 22px; }
      .info { font-size: 13px; }
    }
  </style>
</head>
<body>

<div class="setup-container">
  <h1>Initial Setup</h1>
  <p class="subtitle">Create your first admin account</p>
  
  <div class="info">
    <strong>Welcome!</strong> This is the first admin account creation. After this, only admins can register new accounts.
  </div>

  <form id="setupForm">
    <div class="form-group">
      <label for="username">Admin Username:</label>
      <input type="text" id="username" name="username" required placeholder="Enter admin username">
    </div>

    <div class="form-group">
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required placeholder="Enter admin password">
    </div>

    <button type="submit">Create Admin Account</button>
  </form>

  <div id="message"></div>
</div>

<script>
document.getElementById("setupForm").onsubmit = async function(e) {
  e.preventDefault();

  const formData = new FormData(this);
  
  try {
    const response = await fetch("/setup", {
      method: "POST",
      body: formData
    });

    const data = await response.json();
    const messageDiv = document.getElementById("message");

    if (data.status === "success") {
      messageDiv.className = "message success";
      messageDiv.innerHTML = `<strong>[SUCCESS]</strong> ${data.message}<br><br><a href="/login" style="color: inherit; text-decoration: underline;">Go to Login</a>`;
      document.getElementById("setupForm").reset();
    } else {
      messageDiv.className = "message error";
      messageDiv.innerHTML = `<strong>[ERROR]</strong> ${data.error}`;
    }
  } catch (err) {
    document.getElementById("message").className = "message error";
    document.getElementById("message").innerHTML = `<strong>[ERROR]</strong> ${err.message}`;
  }
};
</script>

</body>
</html>
