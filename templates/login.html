<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - QR Attendance</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .login-box {
      max-width: 400px;
      width: 100%;
      padding: 30px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .login-box h2 { 
      margin-bottom: 20px; 
      color: #333;
      text-align: center;
    }
    .login-box input {
      padding: 12px;
      width: 100%;
      margin: 10px 0;
      border: 2px solid #e0e0e0;
      border-radius: 5px;
      font-size: 16px;
    }
    .login-box input:focus {
      border-color: #667eea;
      outline: none;
    }
    .login-box button {
      padding: 12px;
      width: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 10px;
    }
    .error-msg {
      background: #f8d7da;
      color: #721c24;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      border-left: 4px solid #dc3545;
    }
    @media (max-width: 480px) {
      .login-box { padding: 20px; }
      .login-box h2 { font-size: 20px; }
    }
  </style>
</head>
<body>

<div class="login-box">
  <h2>QR Attendance System</h2>

  {% if error %}
  <div class="error-msg">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login">
    <input name="username" placeholder="Username" required>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <p style="margin-top: 20px; text-align: center; color: #666; font-size: 14px;">
    Contact your admin to register
  </p>
</div>

</body>
</html>
