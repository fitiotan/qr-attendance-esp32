<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - QR Attendance</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }
    .login-box {
      max-width: 450px;
      width: 100%;
      padding: 40px 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }
    .login-box h1 {
      margin-bottom: 10px;
      color: #333;
      text-align: center;
      font-size: 28px;
    }
    .login-box p {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .login-box input {
      padding: 14px 16px;
      width: 100%;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s;
      font-family: inherit;
    }
    .login-box input:focus {
      border-color: #667eea;
      outline: none;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .login-box input::placeholder {
      color: #aaa;
    }
    .login-box button {
      padding: 14px;
      width: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    .login-box button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    .login-box button:active {
      transform: translateY(0);
    }
    .error-msg {
      background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
      color: #721c24;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid #dc3545;
      font-size: 14px;
    }
    .footer {
      margin-top: 25px;
      text-align: center;
      color: #666;
      font-size: 13px;
    }
    @media (max-width: 600px) {
      .login-box {
        padding: 30px 20px;
        border-radius: 12px;
      }
      .login-box h1 {
        font-size: 24px;
      }
      .login-box input,
      .login-box button {
        font-size: 16px;
        padding: 13px 14px;
      }
    }
    @media (max-width: 400px) {
      body {
        padding: 10px;
      }
      .login-box {
        padding: 25px 18px;
      }
      .login-box h1 {
        font-size: 22px;
        margin-bottom: 8px;
      }
      .login-box p {
        font-size: 13px;
        margin-bottom: 20px;
      }
      .form-group {
        margin-bottom: 14px;
      }
    }
  </style>
</head>
<body>

<div class="login-box">
  <h1>QR Attendance System</h1>
  <p>Login to your account</p>

  {% if error %}
  <div class="error-msg">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login">
    <div class="form-group">
      <input name="username" type="text" placeholder="Username" required autofocus>
    </div>
    <div class="form-group">
      <input name="password" type="password" placeholder="Password" required>
    </div>
    <button type="submit">Login</button>
  </form>

  <div class="footer">
    Don't have an account? Contact your admin to register
  </div>
</div>

</body>
</html>
