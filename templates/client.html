<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Attendance - Client</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 10px;
    }
    .container { 
      max-width: 700px; 
      margin: 20px auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    .header h1 { font-size: 24px; margin-bottom: 10px; }
    .header p { opacity: 0.9; font-size: 14px; }
    .header a {
      color: white;
      text-decoration: none;
      padding: 8px 15px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      display: inline-block;
      margin-top: 10px;
      transition: all 0.3s;
    }
    .header a:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .content {
      padding: 30px;
      text-align: center;
    }
    .content h2 {
      color: #333;
      margin-bottom: 10px;
      font-size: 22px;
    }
    .content p {
      color: #666;
      margin-bottom: 20px;
    }
    button { 
      width: 100%; 
      max-width: 400px;
      padding: 16px; 
      font-size: 16px; 
      margin: 12px auto;
      cursor: pointer;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      display: block;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    button:active {
      transform: translateY(0);
    }
    .logout-btn {
      background: linear-gradient(135deg, #f56565 0%, #c53030 100%);
      box-shadow: 0 4px 15px rgba(245, 101, 101, 0.4);
      max-width: 200px;
      margin-top: 20px;
    }
    .logout-btn:hover {
      box-shadow: 0 6px 20px rgba(245, 101, 101, 0.6);
    }
    #qrBox { 
      margin: 20px auto;
      text-align: center;
    }
    #qrBox img { 
      max-width: 300px; 
      width: 100%; 
      border: 2px solid #667eea;
      padding: 10px; 
      border-radius: 8px;
      background: white;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    #timer {
      font-size: 16px;
      color: #667eea;
      font-weight: 500;
      margin-top: 15px;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 5px;
      display: inline-block;
    }
    @media (max-width: 480px) {
      .header h1 { font-size: 20px; }
      .content h2 { font-size: 18px; }
      .content { padding: 20px; }
      .content p, #timer { font-size: 14px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>QR Attendance System</h1>
    <p>Logged in as: <strong>{{ username }}</strong></p>
  </div>

  <div class="content">
    <h2 id="qrTitle">Your QR Code for Attendance</h2>
    <p id="qrDescription">Show this QR code to the admin to record your attendance (valid for 1 minute).</p>

    <button onclick="generateQR()" id="generateBtn">Generate New QR Code</button>

    <div id="qrBox"></div>
    <div id="timer"></div>

    <a href="/logout" style="display: block; margin-top: 30px;">
      <button class="logout-btn">Logout</button>
    </a>
  </div>
</div>

<script>
let qrRefreshInterval;

function checkStatus() {
  fetch('/client/check-status')
    .then(res => res.json())
    .then(data => {
      const title = document.getElementById('qrTitle');
      const description = document.getElementById('qrDescription');
      const button = document.getElementById('generateBtn');
      
      if (data.checked_in) {
        title.textContent = 'Check Out QR Code';
        description.textContent = 'Show this QR code to the admin to record your check-out (valid for 1 minute).';
        button.textContent = 'Generate Check Out QR Code';
      } else {
        title.textContent = 'Check In QR Code';
        description.textContent = 'Show this QR code to the admin to record your check-in (valid for 1 minute).';
        button.textContent = 'Generate Check In QR Code';
      }
    });
}

function generateQR() {
  fetch(`/generate_qr`, {
    method: "POST"
  })
  .then(res => res.json())
  .then(data => {
    if (data.error) {
      alert(data.error);
      return;
    }
    document.getElementById("qrBox").innerHTML =
      `<img src="/static/${data.qr_path}" style="max-width: 300px; width: 100%; border: 2px solid #333; padding: 10px; border-radius: 5px;">`;
    
    // Clear old interval and start new one
    clearInterval(qrRefreshInterval);
    startQRTimer();
  })
  .catch(err => console.error(err));
}

function startQRTimer() {
  let remaining = 60;
  document.getElementById("timer").innerHTML = `QR expires in: ${remaining}s`;
  
  qrRefreshInterval = setInterval(() => {
    remaining--;
    document.getElementById("timer").innerHTML = `QR expires in: ${remaining}s`;
    
    if (remaining <= 0) {
      document.getElementById("qrBox").innerHTML = '';
      document.getElementById("timer").innerHTML = 'QR code expired. Click button to generate new one.';
      clearInterval(qrRefreshInterval);
      
      // Check if status changed (they scanned a QR) and update UI
      checkStatus();
    }
  }, 1000);
}

// Check status and generate QR on page load
window.onload = function() {
  checkStatus();
  generateQR();
  
  // Periodically check status every 5 seconds to detect check-in/check-out changes
  setInterval(checkStatus, 5000);
};
</script>

</body>
</html>
