<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register New Client - Admin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 500px;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    .header h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }
    .header p {
      opacity: 0.95;
      font-size: 14px;
    }
    .content {
      padding: 30px;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s;
    }
    .back-link:hover {
      color: #764ba2;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.3s;
      background: #f8f9fa;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    button:active {
      transform: translateY(0);
    }
    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      display: none;
    }
    .message.success {
      background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
      color: #155724;
      border-left: 4px solid #28a745;
      display: block;
    }
    .message.error {
      background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
      color: #721c24;
      border-left: 4px solid #dc3545;
      display: block;
    }
    @media (max-width: 480px) {
      .container { border-radius: 10px; }
      .header { padding: 20px; }
      .header h1 { font-size: 24px; }
      .content { padding: 20px; }
      input { padding: 10px 12px; }
      button { padding: 12px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Register New Client</h1>
    <p>Logged in as: <strong>{{ username }}</strong> (Admin)</p>
  </div>
  
  <div class="content">
    <a href="/admin" class="back-link">← Back to Admin Panel</a>
    
    <form id="registerForm">
      <div class="form-group">
        <label for="username">Client Username</label>
        <input type="text" id="username" name="username" required placeholder="Enter client username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Enter password">
      </div>

      <button type="submit">Register Client</button>
    </form>

    <div id="message" class="message"></div>
  </div>
</div>

<script>
document.getElementById("registerForm").onsubmit = async function(e) {
  e.preventDefault();

  const formData = new FormData(this);

  const response = await fetch("/admin/register", {
    method: "POST",
    body: formData
  });

  const data = await response.json();
  const messageDiv = document.getElementById("message");

  if (data.status === "success") {
    messageDiv.className = "message success";
    messageDiv.innerHTML = `✓ ${data.message}`;
    document.getElementById("registerForm").reset();
  } else {
    messageDiv.className = "message error";
    messageDiv.innerHTML = `✗ Error: ${data.error}`;
  }
};
</script>

</body>
</html>
